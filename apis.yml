aid: tagetik
name: CCH Tagetik
description: >-
  CCH Tagetik (a Wolters Kluwer solution) is a comprehensive Corporate Performance Management platform covering
  financial close and consolidation, extended planning and analysis, ESG and regulatory reporting, and corporate tax
  management. The platform exposes data via OData v4 REST APIs and SCIM, enabling integration with Power BI, Qlik, SAP
  HANA, and other BI tools. OAuth 2.0 and Basic Authentication are supported for secure access.
